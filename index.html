<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能家居案例展示系统</title>
    <style>
      .file-demo {
        min-height: 100vh;
        margin: 0;
        color: #172033;
        background: #f5f7f4;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      .file-demo * {
        box-sizing: border-box;
      }

      .file-demo button {
        font: inherit;
      }

      .file-topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px clamp(18px, 4vw, 56px);
        border-bottom: 1px solid rgba(23, 32, 51, 0.08);
        background: rgba(245, 247, 244, 0.92);
        backdrop-filter: blur(14px);
      }

      .file-brand {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        border: 0;
        color: inherit;
        background: transparent;
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
      }

      .file-brand span:first-child {
        display: grid;
        width: 116px;
        height: 64px;
        place-items: center;
        border-radius: 8px;
        color: #ffffff;
        background: #ffffff;
        font-size: 0.86rem;
        line-height: 1;
        white-space: nowrap;
      }

      .file-brand img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 6px;
      }

      .file-nav {
        display: flex;
        gap: 8px;
      }

      .file-nav button,
      .file-ghost,
      .file-primary {
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      .file-nav button,
      .file-ghost {
        border: 1px solid rgba(23, 32, 51, 0.12);
        color: #172033;
        background: #ffffff;
      }

      .file-primary {
        border: 1px solid #0f766e;
        color: #ffffff;
        background: #0f766e;
      }

      .file-hero {
        position: relative;
        min-height: calc(100vh - 70px);
        overflow: hidden;
        padding: clamp(34px, 8vh, 72px) clamp(20px, 7vw, 96px);
        color: #ffffff;
      }

      .file-hero::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          linear-gradient(90deg, rgba(11, 18, 32, 0.84), rgba(11, 18, 32, 0.46), rgba(11, 18, 32, 0.2)),
          url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1600&q=82")
            center/cover;
      }

      .file-hero-layout {
        position: relative;
        z-index: 1;
        width: min(1180px, 100%);
      }

      .file-hero-content {
        max-width: 760px;
        min-width: 0;
      }

      .file-eyebrow {
        margin: 0 0 12px;
        color: #0f766e;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .file-hero .file-eyebrow {
        color: #99f6e4;
      }

      .file-hero h1,
      .file-page h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 6vw, 5rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .file-hero h1 {
        max-width: 100%;
        font-size: clamp(2.2rem, 5vw, 4.4rem);
        white-space: nowrap;
      }

      .file-hero p {
        max-width: 640px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 1.16rem;
        line-height: 1.55;
      }

      .file-hero-points {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .file-hero-points span {
        padding: 8px 11px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.12);
        font-size: 0.92rem;
        font-weight: 800;
      }

      .file-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .file-page {
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: 52px 0 76px;
      }

      .file-page > p {
        max-width: 760px;
        color: #5b6778;
        line-height: 1.7;
      }

      .file-proof {
        position: absolute;
        z-index: 1;
        right: clamp(20px, 7vw, 96px);
        bottom: clamp(28px, 5vh, 54px);
        left: clamp(20px, 7vw, 96px);
        display: grid;
        grid-auto-flow: column;
        justify-content: start;
        align-items: center;
        gap: 8px 12px;
        max-width: min(900px, calc(100% - 40px));
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(11, 18, 32, 0.34);
        backdrop-filter: blur(10px);
      }

      .file-proof strong {
        font-size: 0.96rem;
      }

      .file-proof > span {
        color: rgba(255, 255, 255, 0.76);
        font-size: 0.9rem;
      }

      .file-proof-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .file-proof-tags b {
        padding: 4px 7px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.86);
        background: rgba(255, 255, 255, 0.1);
        font-size: 0.8rem;
      }

      .file-map-layout,
      .file-showroom {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px;
        margin-top: 24px;
      }

      .file-map {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background:
          linear-gradient(120deg, rgba(214, 198, 168, 0.5), rgba(233, 241, 243, 0.78)),
          radial-gradient(circle at 22% 24%, rgba(15, 118, 110, 0.16), transparent 28%),
          radial-gradient(circle at 72% 70%, rgba(176, 137, 104, 0.22), transparent 30%);
      }

      .file-map::before {
        position: absolute;
        left: -10%;
        top: 48%;
        width: 120%;
        height: 82px;
        transform: rotate(-12deg);
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.22);
        content: "";
      }

      .file-pin {
        position: absolute;
        transform: translate(-18px, -18px);
        max-width: 140px;
        padding: 9px 10px;
        border: 1px solid rgba(15, 118, 110, 0.2);
        border-radius: 8px;
        color: #0f766e;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 28px rgba(23, 32, 51, 0.12);
        cursor: pointer;
      }

      .file-pin.active {
        color: #ffffff;
        background: #0f766e;
      }

      .file-card,
      .file-panel,
      .file-case-button,
      .file-status div {
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 38px rgba(31, 41, 55, 0.06);
      }

      .file-card {
        overflow: hidden;
      }

      .file-card img {
        display: block;
        width: 100%;
        height: 210px;
        object-fit: cover;
      }

      .file-card-body,
      .file-panel {
        padding: 18px;
      }

      .file-case-list,
      .file-scene-list,
      .file-product-list {
        display: grid;
        gap: 10px;
      }

      .file-case-button,
      .file-scene-list button,
      .file-product-list button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        color: #172033;
        text-align: left;
        cursor: pointer;
      }

      .file-case-button.active,
      .file-scene-list button.active {
        border-color: #0f766e;
        color: #0f766e;
        background: #dff4ee;
      }

      .file-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0;
      }

      .file-tags span {
        padding: 7px 10px;
        border-radius: 8px;
        color: #0f766e;
        background: #dff4ee;
        font-weight: 700;
      }

      .file-lighting-section {
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: 58px 0 78px;
      }

      .file-page .file-lighting-section {
        width: 100%;
        padding: 24px 0 0;
      }

      .file-lighting-heading {
        max-width: 760px;
        margin-bottom: 24px;
      }

      .file-lighting-heading h2 {
        margin: 0 0 12px;
        color: #172033;
        font-size: clamp(1.9rem, 3.5vw, 3.2rem);
      }

      .file-lighting-heading p:last-child,
      .file-lighting-card p {
        color: #5b6778;
        line-height: 1.75;
      }

      .file-lighting-grid {
        display: grid;
        gap: 20px;
      }

      .file-lighting-card {
        display: grid;
        grid-template-columns: minmax(280px, 0.82fr) minmax(0, 1.18fr);
        gap: 22px;
        align-items: stretch;
        padding: 22px;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 38px rgba(31, 41, 55, 0.06);
      }

      .file-lighting-card h3 {
        margin: 0 0 12px;
        font-size: 1.45rem;
      }

      .file-lighting-actions,
      .file-lighting-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .file-lighting-metrics {
        margin: 16px 0 18px;
      }

      .file-lighting-metrics span {
        padding: 8px 10px;
        border-radius: 8px;
        color: #31515b;
        background: #e7eee8;
        font-size: 0.9rem;
        font-weight: 800;
      }

      .file-lighting-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 700;
        text-decoration: none;
      }

      .file-lighting-hint {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid rgba(15, 118, 110, 0.16);
        border-radius: 8px;
        color: #0f766e;
        background: #e7eee8;
        font-weight: 800;
      }

      .file-lighting-actions a {
        border: 1px solid rgba(23, 32, 51, 0.12);
        color: #172033;
        background: #ffffff;
      }

      .file-lighting-gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .file-lighting-gallery a {
        position: relative;
        display: grid;
        min-height: 150px;
        align-content: space-between;
        gap: 14px;
        padding: 18px;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        color: #172033;
        text-decoration: none;
        background: #f7f8f6;
        transition:
          border-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .file-lighting-gallery a:hover {
        border-color: rgba(15, 118, 110, 0.28);
        box-shadow: 0 14px 28px rgba(31, 41, 55, 0.08);
        transform: translateY(-2px);
      }

      .file-lighting-gallery b {
        position: absolute;
        top: 14px;
        right: 14px;
        color: #9aa5b5;
        font-size: 0.82rem;
      }

      .file-lighting-gallery strong {
        font-size: 1.08rem;
      }

      .file-lighting-gallery span {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #435163;
        font-weight: 800;
      }

      .file-budget-hero {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(360px, 1.05fr);
        gap: 28px;
        align-items: center;
        margin-top: 24px;
      }

      .file-budget-hero h1 {
        font-size: clamp(2rem, 4.2vw, 4rem);
      }

      .file-budget-hero p,
      .file-budget-card p,
      .file-budget-heading p {
        color: #5b6778;
        line-height: 1.7;
      }

      .file-budget-tags,
      .file-budget-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .file-budget-tags span,
      .file-budget-meta span {
        padding: 7px 10px;
        border-radius: 8px;
        color: #31515b;
        background: #e7eee8;
        font-weight: 800;
      }

      .file-budget-tags span {
        color: #0f766e;
        background: #dff4ee;
      }

      .file-budget-sheet,
      .file-budget-card {
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 38px rgba(31, 41, 55, 0.06);
      }

      .file-budget-sheet {
        overflow: hidden;
      }

      .file-budget-sheet div {
        display: grid;
        grid-template-columns: 0.58fr 1.05fr 1.05fr;
      }

      .file-budget-sheet div:first-child {
        color: #ffffff;
        background: #172033;
        font-weight: 900;
      }

      .file-budget-sheet div:not(:first-child) {
        border-top: 1px solid rgba(23, 32, 51, 0.07);
      }

      .file-budget-sheet span {
        padding: 14px;
        border-right: 1px solid rgba(23, 32, 51, 0.07);
        line-height: 1.5;
      }

      .file-budget-sheet span:last-child {
        border-right: 0;
      }

      .file-budget-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .file-budget-card {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 18px;
      }

      .file-budget-card h3 {
        margin: 0;
        font-size: 1.24rem;
      }

      .file-budget-thumb,
      .file-budget-icon {
        width: 100%;
        aspect-ratio: 16 / 10;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #eef4f1;
      }

      .file-budget-thumb {
        object-fit: cover;
        object-position: top;
      }

      .file-budget-icon {
        display: grid;
        place-items: center;
        color: #0f766e;
        font-size: 2rem;
        font-weight: 900;
      }

      .file-budget-card button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        border: 0;
        margin-top: auto;
        border-radius: 8px;
        color: #ffffff;
        background: #0f766e;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      .file-budget-viewer {
        display: grid;
        gap: 18px;
        margin-top: 28px;
        padding: 20px;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 38px rgba(31, 41, 55, 0.06);
      }

      .file-budget-viewer-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      .file-budget-viewer-head h2 {
        margin: 0 0 6px;
        font-size: clamp(1.45rem, 2.4vw, 2.2rem);
      }

      .file-budget-viewer-head p:last-child {
        color: #5b6778;
        line-height: 1.6;
      }

      .file-budget-viewer-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .file-budget-viewer-actions button {
        min-height: 44px;
        border: 1px solid rgba(23, 32, 51, 0.12);
        border-radius: 8px;
        padding: 10px 14px;
        color: #172033;
        background: #ffffff;
        cursor: pointer;
        font-weight: 800;
      }

      .file-budget-viewer-actions button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
      }

      .file-budget-viewer-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 150px;
        gap: 16px;
        align-items: start;
      }

      .file-budget-page-image {
        display: grid;
        min-height: 520px;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #eef4f1;
      }

      .file-budget-page-image img {
        display: block;
        width: 100%;
        height: auto;
      }

      .file-budget-page-strip {
        display: grid;
        max-height: 720px;
        gap: 10px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .file-budget-page-strip button {
        position: relative;
        overflow: hidden;
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 0;
        background: #eef4f1;
        cursor: pointer;
      }

      .file-budget-page-strip button.active {
        border-color: #0f766e;
      }

      .file-budget-page-strip img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        object-position: top;
      }

      .file-budget-page-strip span {
        position: absolute;
        right: 6px;
        bottom: 6px;
        padding: 3px 6px;
        border-radius: 6px;
        color: #ffffff;
        background: rgba(11, 18, 32, 0.76);
        font-size: 0.78rem;
        font-weight: 900;
      }

      .file-panorama {
        position: relative;
        min-height: 420px;
        margin: 24px 0;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #101827;
        box-shadow: 0 18px 38px rgba(31, 41, 55, 0.08);
      }

      .file-panorama-view {
        width: 100%;
        height: 420px;
        cursor: grab;
        background-image: var(--panorama-image);
        background-size: auto 110%;
        background-position: var(--panorama-x, 50%) center;
        background-repeat: repeat-x;
        transition: filter 180ms ease;
        touch-action: none;
      }

      .file-panorama-view:active {
        cursor: grabbing;
      }

      .file-panorama::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(11, 18, 32, 0.26), transparent 22%, transparent 78%, rgba(11, 18, 32, 0.2));
        content: "";
      }

      .file-panorama-caption {
        position: absolute;
        z-index: 2;
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 4px;
        max-width: min(520px, calc(100% - 32px));
        padding: 10px 12px;
        border-radius: 8px;
        color: #ffffff;
        background: rgba(11, 18, 32, 0.72);
      }

      .file-panorama-caption strong {
        font-size: 1rem;
      }

      .file-panorama-caption small {
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.5;
      }

      .file-room {
        position: relative;
        min-height: 640px;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background:
          linear-gradient(180deg, var(--room-light, #fff2c2), transparent 52%),
          linear-gradient(135deg, #e9f1f3 0 44%, #d6c6a8 44% 100%);
        transition: background 260ms ease;
      }

      .file-room-caption {
        position: absolute;
        z-index: 2;
        left: 18px;
        top: 18px;
        max-width: min(600px, calc(100% - 36px));
        padding: 12px 14px;
        border-radius: 8px;
        color: #ffffff;
        background: rgba(11, 18, 32, 0.72);
      }

      .file-room-caption strong,
      .file-room-caption small {
        display: block;
      }

      .file-room-caption small {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.5;
      }

      .file-room::before {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 0;
        height: 38%;
        transform: perspective(520px) rotateX(62deg);
        transform-origin: bottom;
        background: repeating-linear-gradient(90deg, #c9b18d 0 12px, #d6c6a8 12px 24px);
        content: "";
      }

      .file-tv,
      .file-sofa,
      .file-table,
      .file-window,
      .file-curtain,
      .file-light,
      .file-ac,
      .file-panel-device {
        position: absolute;
        border-radius: 8px;
      }

      .file-tv {
        left: 39%;
        top: 29%;
        width: 22%;
        height: 15%;
        background: #172033;
      }

      .file-sofa {
        left: 28%;
        bottom: 17%;
        width: 42%;
        height: 18%;
        background: #52796f;
        box-shadow: inset 0 26px 0 #46655d;
      }

      .file-table {
        left: 41%;
        bottom: 13%;
        width: 18%;
        height: 6%;
        background: #b08968;
      }

      .file-window {
        left: 9%;
        top: 23%;
        width: 22%;
        height: 34%;
        background: #b7e4f9;
      }

      .file-curtain {
        left: 9%;
        top: 20%;
        width: calc(22% * var(--curtain, 0.22));
        height: 40%;
        background: rgba(139, 94, 84, 0.9);
        transition: width 260ms ease;
      }

      .file-light {
        left: 47%;
        top: 12%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--room-light, #fff2c2);
        box-shadow: 0 0 calc(90px * var(--lamp-power, 1)) var(--room-light, #fff2c2);
        transition: all 260ms ease;
      }

      .file-ac {
        right: 12%;
        top: 20%;
        width: 15%;
        height: 8%;
        background: #ffffff;
      }

      .file-panel-device {
        right: 11%;
        top: 45%;
        width: 7%;
        height: 12%;
        background: #111827;
      }

      .file-hotspot {

              </aside>
            </section>
          `;
          document.querySelector("[data-home-cases]").addEventListener("click", showCases);
          document.querySelector("[data-home-showroom]").addEventListener("click", showShowroom);
          document.querySelector("[data-home-lighting]").addEventListener("click", showLighting);
          document.querySelector("[data-home-budget]").addEventListener("click", showBudget);
        }

        function showBudget() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <button class="file-ghost" data-budget-back>返回首页</button>
              <div class="file-budget-hero">
                <div>
                  <p class="file-eyebrow">方案预算样本</p>
                  <h1>让客户看懂钱花在哪，也看懂家怎么用</h1>
                  <p>我们把设备清单、空间位置、生活场景和预算放在同一套资料里。客户不用只看一张密密麻麻的报价表，可以知道每个房间有哪些功能、每个场景由哪些设备配合完成。</p>
                  <div class="file-budget-tags">
                    <span>按空间分区</span>
                    <span>设备和功能对应</span>
                    <span>方便增减预算</span>
                  </div>
                </div>
                <div class="file-budget-sheet" aria-label="方案预算表格示意">
                  <div><span>空间</span><span>功能</span><span>预算说明</span></div>
                  <div><span>客厅</span><span>灯光 / 窗帘 / 影音</span><span>回家、观影、会客</span></div>
                  <div><span>卧室</span><span>灯光 / 空调 / 窗帘</span><span>睡前、起夜、晨起</span></div>
                  <div><span>安防</span><span>门锁 / 传感器 / 摄像头</span><span>离家提醒、异常提醒</span></div>
                  <div><span>网络</span><span>路由 / 面板 / 覆盖</span><span>全屋稳定联网</span></div>
                </div>
              </div>
              <div class="file-budget-heading" style="margin-top:34px">
                <p class="file-eyebrow">典型方案模板</p>
                <h2>可打开查看的方案预算样本</h2>
                <p>下面这些是做过的典型方案类型，用来展示资料的专业程度和客户理解成本，而不是固定报价。</p>
              </div>
              <div class="file-budget-grid">
                ${budgetPlans
                  .map(
                    (plan) => `
                      <article class="file-budget-card">
                        ${
                          plan.thumbnail
                            ? `<img class="file-budget-thumb" src="${plan.thumbnail}" alt="${plan.name}封面预览">`
                            : `<div class="file-budget-icon">PDF</div>`
                        }
                        <p class="file-eyebrow">${plan.homeType}</p>
                        <h3>${plan.name}</h3>
                        <p>${plan.focus}</p>
                        <div class="file-budget-meta">
                          <span>${plan.pageLabel}</span>
                          ${plan.highlights.map((item) => `<span>${item}</span>`).join("")}
                        </div>
                        <button type="button" data-budget-open="${plan.id}">在线观看方案</button>
                      </article>
                    `,
                  )
                  .join("")}
              </div>
              ${renderBudgetViewer()}
            </section>
          `;
          document.querySelector("[data-budget-back]").addEventListener("click", showHome);
          document.querySelectorAll("[data-budget-open]").forEach((button) => {
            button.addEventListener("click", () => {
              activeBudgetPlan = budgetPlans.find((plan) => plan.id === button.dataset.budgetOpen) || budgetPlans[0];
              activeBudgetPage = 0;
              showBudget();
              setTimeout(() => document.getElementById("file-budget-viewer")?.scrollIntoView({ behavior: "smooth", block: "start" }), 0);
            });
          });
          document.querySelector("[data-budget-prev]")?.addEventListener("click", () => {
            activeBudgetPage = Math.max(0, activeBudgetPage - 1);
            showBudget();
          });
          document.querySelector("[data-budget-next]")?.addEventListener("click", () => {
            if (!activeBudgetPlan) return;
            activeBudgetPage = Math.min(activeBudgetPlan.pages.length - 1, activeBudgetPage + 1);
            showBudget();
          });
          document.querySelectorAll("[data-budget-page]").forEach((button) => {
            button.addEventListener("click", () => {
              activeBudgetPage = Number(button.dataset.budgetPage) || 0;
              showBudget();
            });
          });
        }

        function renderBudgetViewer() {
          if (!activeBudgetPlan) return "";
          return `
            <section class="file-budget-viewer" id="file-budget-viewer" aria-labelledby="file-budget-viewer-title">
              <div class="file-budget-viewer-head">
                <div>
                  <p class="file-eyebrow">在线预览</p>
                  <h2 id="file-budget-viewer-title">${activeBudgetPlan.name}</h2>
                  <p>第 ${activeBudgetPage + 1} 页 / 共 ${activeBudgetPlan.pages.length} 页</p>
                </div>
                <div class="file-budget-viewer-actions">
                  <button type="button" data-budget-prev ${activeBudgetPage === 0 ? "disabled" : ""}>上一页</button>
                  <button type="button" data-budget-next ${activeBudgetPage >= activeBudgetPlan.pages.length - 1 ? "disabled" : ""}>下一页</button>
                </div>
              </div>
              <div class="file-budget-viewer-layout">
                <div class="file-budget-page-image">
                  <img src="${activeBudgetPlan.pages[activeBudgetPage]}" alt="${activeBudgetPlan.name}第 ${activeBudgetPage + 1} 页">
                </div>
                <aside class="file-budget-page-strip" aria-label="${activeBudgetPlan.name}页面列表">
                  ${activeBudgetPlan.pages
                    .map(
                      (page, index) => `
                        <button class="${index === activeBudgetPage ? "active" : ""}" type="button" data-budget-page="${index}" aria-label="查看第 ${index + 1} 页">
                          <img src="${page}" alt="">
                          <span>${String(index + 1).padStart(2, "0")}</span>
                        </button>
                      `,
                    )
                    .join("")}
                </aside>
              </div>
            </section>
          `;
        }

        function showLighting() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <button class="file-ghost" data-lighting-back>返回首页</button>
              ${renderLightingPlans()}
            </section>
          `;
          document.querySelector("[data-lighting-back]").addEventListener("click", showHome);
        }

        function renderLightingPlans() {
          return `
            <section class="file-lighting-section" aria-labelledby="file-lighting-title">
              <div class="file-lighting-heading">
                <p class="file-eyebrow">专业灯光方案</p>
                <h2 id="file-lighting-title">灯光场景模拟及照度计算</h2>
                <p>在施工前先把灯光效果、亮度分布和关键点位展示出来，客户能更直观看到每个空间的明暗关系，也方便设计和施工人员统一方案。</p>
              </div>
              <div class="file-lighting-grid">
                ${lightingPlans
                  .map(
                    (plan) => `
                      <article class="file-lighting-card">
                        <div>
                          <p class="file-eyebrow">${plan.type}</p>
                          <h3>${plan.name}</h3>
                          <p>${plan.summary}</p>
                          <div class="file-lighting-metrics">
                            ${plan.metrics.map((metric) => `<span>${metric}</span>`).join("")}
                          </div>
                          <div class="file-lighting-actions">
                            <span class="file-lighting-hint">点击下方场景卡片查看方案</span>
                            <a href="${plan.reportUrl}" target="_blank" rel="noreferrer">${plan.reportLabel}</a>
                          </div>
                        </div>
                        <div class="file-lighting-gallery">
                          ${plan.images
                            .map(
                              (image, index) => `
                                <a href="${image.url}" target="_blank" rel="noreferrer" aria-label="打开${plan.name}${image.label}">
                                  <b>${String(index + 1).padStart(2, "0")}</b>
                                  <span>灯光场景</span>
                                  <strong>${image.label}</strong>
                                  <span>在线查看场景 ↗</span>
                                </a>
                              `,
                            )
                            .join("")}
                        </div>
                      </article>
                    `,
                  )
                  .join("")}
              </div>
            </section>
          `;
        }

        function showCases() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <p class="file-eyebrow">案例地图</p>
              <h1>已落地小区案例</h1>
              <p>先看做过哪些小区，再看每套房子怎么把灯光、窗帘、空调和安防变成日常好用的生活场景。</p>
              <div class="file-map-layout">
                <div class="file-map">
                  ${cases
                    .map(
                      (item) =>
                        `<button class="file-pin ${item.id === activeCase.id ? "active" : ""}" style="left:${item.x}%;top:${item.y}%" data-case="${item.id}">📍 ${item.name}</button>`,
                    )
                    .join("")}
                </div>
                <aside>
                  <div class="file-case-list">
                    ${cases
                      .map(
                        (item) =>
                          `<button class="file-case-button ${item.id === activeCase.id ? "active" : ""}" data-case="${item.id}"><strong>${item.name}</strong><br><small>${item.city}</small></button>`,
                      )
                      .join("")}
                  </div>
                  <article class="file-card" style="margin-top:14px">
                    <img src="${activeCase.cover}" alt="${activeCase.name}案例封面">
                    <div class="file-card-body">
                      <p class="file-eyebrow">${activeCase.city}</p>
                      <h2>${activeCase.name}</h2>
                      <p>${activeCase.intro}</p>
                      <p><strong>${activeCase.homeType}</strong></p>
                      <div class="file-tags">${activeCase.scenes.map((item) => `<span>${item}</span>`).join("")}</div>
                      <ul>${activeCase.highlights.map((item) => `<li>${item}</li>`).join("")}</ul>
                      <button class="file-primary" data-detail>查看详情</button>
                    </div>
                  </article>
                </aside>
              </div>
            </section>
          `;
          document.querySelectorAll("[data-case]").forEach((button) => {
            button.addEventListener("click", () => {
              activeCase = cases.find((item) => item.id === button.dataset.case) || cases[0];
              showCases();
            });
          });
          document.querySelector("[data-detail]").addEventListener("click", showDetail);
        }

        function showDetail() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <button class="file-ghost" data-back>返回案例地图</button>
              <p class="file-eyebrow" style="margin-top:24px">${activeCase.city}</p>
              <h1>${activeCase.name}</h1>
              <p>${activeCase.intro}</p>
              <div class="file-panorama" style="--panorama-image:url('${activeCase.panorama}')">
                <div class="file-panorama-view" data-panorama-view role="img" aria-label="${activeCase.name}全景图浏览"></div>
                <div class="file-panorama-caption">
                  <strong>全景图浏览</strong>
                  <small>按住画面左右拖动，像站在客厅里一样查看空间。客户可以先感受整体氛围，再进入场景演示看设备联动。</small>
                </div>
              </div>
              <div class="file-card">
                <img src="${activeCase.cover}" alt="${activeCase.name}案例图片" style="height:360px">
                <div class="file-card-body">
                  <h2>案例详情</h2>
                  <p><strong>户型面积：</strong>${activeCase.homeType}</p>
                  <p><strong>智能设备：</strong>智能灯、智能窗帘、智能面板、空调控制器、门窗传感器</p>
                  <p><strong>客户收益：</strong>${activeCase.benefits.join("、")}。</p>
                  <div class="file-tags">${activeCase.highlights.map((item) => `<span>${item}</span>`).join("")}</div>
                  <button class="file-primary" data-go-showroom>查看案例演示</button>
                </div>
              </div>
            </section>
          `;
          document.querySelector("[data-back]").addEventListener("click", showCases);
          document.querySelector("[data-go-showroom]").addEventListener("click", showShowroom);
          bindPanoramaDrag();
        }

        function bindPanoramaDrag() {
          const view = document.querySelector("[data-panorama-view]");
          if (!view) return;

          let position = 50;

          view.addEventListener("pointerdown", (event) => {
            panoramaDrag = { startX: event.clientX, startPosition: position };
            view.setPointerCapture(event.pointerId);
          });

          view.addEventListener("pointermove", (event) => {
            if (!panoramaDrag) return;
            const movement = (event.clientX - panoramaDrag.startX) * 0.08;
            position = ((panoramaDrag.startPosition - movement) % 100 + 100) % 100;
            view.style.setProperty("--panorama-x", `${position}%`);
          });

          const endDrag = (event) => {
            panoramaDrag = null;
            if (view.hasPointerCapture(event.pointerId)) {
              view.releasePointerCapture(event.pointerId);
            }
          };

          view.addEventListener("pointerup", endDrag);
          view.addEventListener("pointercancel", endDrag);
        }

        function showShowroom() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <p class="file-eyebrow">智能家居案例演示</p>
              <h1>客厅生活场景</h1>
              <p>切换不同模式，看同一个客厅怎样从进门明亮、晚饭后放松，过渡到睡前温暖和离家看护。</p>
              <div class="file-showroom">
                <div class="file-room" style="--room-light:${activeScene.color};--lamp-power:${activeScene.power};--curtain:${activeScene.curtainValue}">
                  <div class="file-room-caption">
                    <strong>${activeScene.name}</strong>
                    <small>${activeScene.detail}</small>
                  </div>
                  <div class="file-window"></div>
                  <div class="file-curtain"></div>
                  <div class="file-tv"></div>
                  <div class="file-sofa"></div>
                  <div class="file-table"></div>
                  <div class="file-light"></div>
                  <div class="file-ac"></div>
                  <div class="file-panel-device"></div>
                  ${products
                    .map(
                      (item) =>
                        `<button class="file-hotspot" style="left:${item.x}%;top:${item.y}%" title="${item.name}" data-product="${item.id}">i</button>`,
                    )
                    .join("")}
                </div>
                <aside class="file-panel">
                  <h2>当前场景：${activeScene.name}</h2>
                  <p class="file-scene-note">${activeScene.detail}</p>
                  <div class="file-scene-list">
                    ${scenes
                      .map(
                        (item) =>
                          `<button class="${item.id === activeScene.id ? "active" : ""}" data-scene="${item.id}">${item.name}</button>`,
                      )
                      .join("")}
                  </div>
                  <div class="file-status">
                    <div><span>灯光</span><strong>${activeScene.light}</strong></div>
                    <div><span>窗帘</span><strong>${activeScene.curtain}</strong></div>
                    <div><span>空调</span><strong>${activeScene.ac}</strong></div>
                    <div><span>安防</span><strong>${activeScene.security}</strong></div>
                  </div>
                  <h2>产品点位</h2>
                  <div class="file-product-list">
                    ${products.map((item) => `<button data-product="${item.id}"><strong>${item.name}</strong><br><small>${item.location}</small></button>`).join("")}
                  </div>
                </aside>
              </div>
            </section>
          `;
          document.querySelectorAll("[data-scene]").forEach((button) => {
            button.addEventListener("click", () => {
              activeScene = scenes.find((item) => item.id === button.dataset.scene) || scenes[0];
              showShowroom();
            });
          });
          document.querySelectorAll("[data-product]").forEach((button) => {
            button.addEventListener("click", () => {
              const product = products.find((item) => item.id === button.dataset.product);
              if (product) openModal(product);
            });
          });
        }

        function openModal(product) {
          document.getElementById("modal-title").textContent = product.name;
          document.getElementById("modal-body").textContent = `产品功能：${product.role}`;
          document.getElementById("modal-location").textContent = `适合位置：${product.location}。当前 ${activeScene.name} 中会配合其它设备一起工作。`;
          document.getElementById("file-modal").classList.add("open");
        }

        function closeModal() {
          document.getElementById("file-modal").classList.remove("open");
        }

        render();
      }

      if (location.protocol !== "file:" && !location.search.includes("static")) {
        import("/src/main.jsx").catch(runFileDemo);
      } else {
        runFileDemo();
      }
    </script>
  </body>
</html>
