<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能家居案例展示系统</title>
    <style>
      .file-demo {
        min-height: 100vh;
        margin: 0;
        color: #172033;
        background: #f5f7f4;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      .file-demo * {
        box-sizing: border-box;
      }

      .file-demo button {
        font: inherit;
      }

      .file-topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px clamp(18px, 4vw, 56px);
        border-bottom: 1px solid rgba(23, 32, 51, 0.08);
        background: rgba(245, 247, 244, 0.92);
        backdrop-filter: blur(14px);
      }

      .file-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 0;
        color: inherit;
        background: transparent;
        font-weight: 800;
        cursor: pointer;
      }

      .file-brand span:first-child {
        display: grid;
        width: 74px;
        height: 42px;
        place-items: center;
        border-radius: 8px;
        color: #ffffff;
        background: #ffffff;
        font-size: 0.86rem;
        line-height: 1;
        white-space: nowrap;
      }

      .file-brand img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 4px;
      }

      .file-nav {
        display: flex;
        gap: 8px;
      }

      .file-nav button,
      .file-ghost,
      .file-primary {
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      .file-nav button,
      .file-ghost {
        border: 1px solid rgba(23, 32, 51, 0.12);
        color: #172033;
        background: #ffffff;
      }

      .file-primary {
        border: 1px solid #0f766e;
        color: #ffffff;
        background: #0f766e;
      }

      .file-hero {
        position: relative;
        min-height: calc(100vh - 70px);
        overflow: hidden;
        padding: clamp(34px, 8vh, 72px) clamp(20px, 7vw, 96px);
        color: #ffffff;
      }

      .file-hero::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          linear-gradient(90deg, rgba(11, 18, 32, 0.84), rgba(11, 18, 32, 0.46), rgba(11, 18, 32, 0.2)),
          url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1600&q=82")
            center/cover;
      }

      .file-hero-layout {
        position: relative;
        z-index: 1;
        width: min(1180px, 100%);
      }

      .file-hero-content {
        max-width: 760px;
        min-width: 0;
      }

      .file-eyebrow {
        margin: 0 0 12px;
        color: #0f766e;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .file-hero .file-eyebrow {
        color: #99f6e4;
      }

      .file-hero h1,
      .file-page h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 6vw, 5rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .file-hero h1 {
        max-width: 100%;
        font-size: clamp(2.2rem, 5vw, 4.4rem);
        white-space: nowrap;
      }

      .file-hero p {
        max-width: 640px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 1.16rem;
        line-height: 1.55;
      }

      .file-hero-points {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .file-hero-points span {
        padding: 8px 11px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.12);
        font-size: 0.92rem;
        font-weight: 800;
      }

      .file-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .file-page {
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: 52px 0 76px;
      }

      .file-page > p {
        max-width: 760px;
        color: #5b6778;
        line-height: 1.7;
      }

      .file-proof {
        position: absolute;
        z-index: 1;
        right: clamp(20px, 7vw, 96px);
        bottom: clamp(28px, 5vh, 54px);
        left: clamp(20px, 7vw, 96px);
        display: grid;
        grid-auto-flow: column;
        justify-content: start;
        align-items: center;
        gap: 8px 12px;
        max-width: min(900px, calc(100% - 40px));
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(11, 18, 32, 0.34);
        backdrop-filter: blur(10px);
      }

      .file-proof strong {
        font-size: 0.96rem;
      }

      .file-proof > span {
        color: rgba(255, 255, 255, 0.76);
        font-size: 0.9rem;
      }

      .file-proof-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .file-proof-tags b {
        padding: 4px 7px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.86);
        background: rgba(255, 255, 255, 0.1);
        font-size: 0.8rem;
      }

      .file-map-layout,
      .file-showroom {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px;
        margin-top: 24px;
      }

      .file-map {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background:
          linear-gradient(120deg, rgba(214, 198, 168, 0.5), rgba(233, 241, 243, 0.78)),
          radial-gradient(circle at 22% 24%, rgba(15, 118, 110, 0.16), transparent 28%),
          radial-gradient(circle at 72% 70%, rgba(176, 137, 104, 0.22), transparent 30%);
      }

      .file-map::before {
        position: absolute;
        left: -10%;
        top: 48%;
        width: 120%;
        height: 82px;
        transform: rotate(-12deg);
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.22);
        content: "";
      }

      .file-pin {
        position: absolute;
        transform: translate(-18px, -18px);
        max-width: 140px;
        padding: 9px 10px;
        border: 1px solid rgba(15, 118, 110, 0.2);
        border-radius: 8px;
        color: #0f766e;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 28px rgba(23, 32, 51, 0.12);
        cursor: pointer;
      }

      .file-pin.active {
        color: #ffffff;
        background: #0f766e;
      }

      .file-card,
      .file-panel,
      .file-case-button,
      .file-status div {
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 38px rgba(31, 41, 55, 0.06);
      }

      .file-card {
        overflow: hidden;
      }

      .file-card img {
        display: block;
        width: 100%;
        height: 210px;
        object-fit: cover;
      }

      .file-card-body,
      .file-panel {
        padding: 18px;
      }

      .file-case-list,
      .file-scene-list,
      .file-product-list {
        display: grid;
        gap: 10px;
      }

      .file-case-button,
      .file-scene-list button,
      .file-product-list button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        color: #172033;
        text-align: left;
        cursor: pointer;
      }

      .file-case-button.active,
      .file-scene-list button.active {
        border-color: #0f766e;
        color: #0f766e;
        background: #dff4ee;
      }

      .file-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0;
      }

      .file-tags span {
        padding: 7px 10px;
        border-radius: 8px;
        color: #0f766e;
        background: #dff4ee;
        font-weight: 700;
      }

      .file-panorama {
        position: relative;
        min-height: 420px;
        margin: 24px 0;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background: #101827;
        box-shadow: 0 18px 38px rgba(31, 41, 55, 0.08);
      }

      .file-panorama-view {
        width: 100%;
        height: 420px;
        cursor: grab;
        background-image: var(--panorama-image);
        background-size: auto 110%;
        background-position: var(--panorama-x, 50%) center;
        background-repeat: repeat-x;
        transition: filter 180ms ease;
        touch-action: none;
      }

      .file-panorama-view:active {
        cursor: grabbing;
      }

      .file-panorama::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(11, 18, 32, 0.26), transparent 22%, transparent 78%, rgba(11, 18, 32, 0.2));
        content: "";
      }

      .file-panorama-caption {
        position: absolute;
        z-index: 2;
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 4px;
        max-width: min(520px, calc(100% - 32px));
        padding: 10px 12px;
        border-radius: 8px;
        color: #ffffff;
        background: rgba(11, 18, 32, 0.72);
      }

      .file-panorama-caption strong {
        font-size: 1rem;
      }

      .file-panorama-caption small {
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.5;
      }

      .file-room {
        position: relative;
        min-height: 640px;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 8px;
        background:
          linear-gradient(180deg, var(--room-light, #fff2c2), transparent 52%),
          linear-gradient(135deg, #e9f1f3 0 44%, #d6c6a8 44% 100%);
        transition: background 260ms ease;
      }

      .file-room-caption {
        position: absolute;
        z-index: 2;
        left: 18px;
        top: 18px;
        max-width: min(600px, calc(100% - 36px));
        padding: 12px 14px;
        border-radius: 8px;
        color: #ffffff;
        background: rgba(11, 18, 32, 0.72);
      }

      .file-room-caption strong,
      .file-room-caption small {
        display: block;
      }

      .file-room-caption small {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.5;
      }

      .file-room::before {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 0;
        height: 38%;
        transform: perspective(520px) rotateX(62deg);
        transform-origin: bottom;
        background: repeating-linear-gradient(90deg, #c9b18d 0 12px, #d6c6a8 12px 24px);
        content: "";
      }

      .file-tv,
      .file-sofa,
      .file-table,
      .file-window,
      .file-curtain,
      .file-light,
      .file-ac,
      .file-panel-device {
        position: absolute;
        border-radius: 8px;
      }

      .file-tv {
        left: 39%;
        top: 29%;
        width: 22%;
        height: 15%;
        background: #172033;
      }

      .file-sofa {
        left: 28%;
        bottom: 17%;
        width: 42%;
        height: 18%;
        background: #52796f;
        box-shadow: inset 0 26px 0 #46655d;
      }

      .file-table {
        left: 41%;
        bottom: 13%;
        width: 18%;
        height: 6%;
        background: #b08968;
      }

      .file-window {
        left: 9%;
        top: 23%;
        width: 22%;
        height: 34%;
        background: #b7e4f9;
      }

      .file-curtain {
        left: 9%;
        top: 20%;
        width: calc(22% * var(--curtain, 0.22));
        height: 40%;
        background: rgba(139, 94, 84, 0.9);
        transition: width 260ms ease;
      }

      .file-light {
        left: 47%;
        top: 12%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--room-light, #fff2c2);
        box-shadow: 0 0 calc(90px * var(--lamp-power, 1)) var(--room-light, #fff2c2);
        transition: all 260ms ease;
      }

      .file-ac {
        right: 12%;
        top: 20%;
        width: 15%;
        height: 8%;
        background: #ffffff;
      }

      .file-panel-device {
        right: 11%;
        top: 45%;
        width: 7%;
        height: 12%;
        background: #111827;
      }

      .file-hotspot {
        position: absolute;
        z-index: 2;
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 2px solid #ffffff;
        border-radius: 50%;
        color: #ffffff;
        background: #0f766e;
        box-shadow: 0 0 0 8px rgba(15, 118, 110, 0.18);
        cursor: pointer;
      }

      .file-status {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0 22px;
      }

      .file-status div {
        min-height: 88px;
        padding: 12px;
      }

      .file-status span {
        display: block;
        color: #748094;
        font-size: 0.9rem;
      }

      .file-status strong {
        display: block;
        margin-top: 6px;
      }

      .file-scene-note {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(23, 32, 51, 0.08);
        color: #5b6778;
        font-size: 0.92rem;
        line-height: 1.7;
      }

      .file-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        place-items: center;
        padding: 18px;
        background: rgba(11, 18, 32, 0.54);
      }

      .file-modal.open {
        display: grid;
      }

      .file-modal-card {
        position: relative;
        width: min(760px, 100%);
        padding: 20px;
        border-radius: 8px;
        background: #ffffff;
      }

      .file-modal-card button {
        position: absolute;
        top: 12px;
        right: 12px;
      }

      @media (max-width: 900px) {
        .file-map-layout,
        .file-showroom {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 680px) {
        .file-topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .file-nav,
        .file-actions {
          width: 100%;
        }

        .file-nav button,
        .file-actions button {
          flex: 1;
        }

        .file-room {
          min-height: 480px;
        }

        .file-hero {
          min-height: calc(100vh - 118px);
          padding: 44px 20px;
        }

        .file-hero h1 {
          font-size: clamp(1.45rem, 7vw, 2.65rem);
        }

        .file-proof {
          position: static;
          display: flex;
          flex-wrap: wrap;
          max-width: none;
          margin-top: 20px;
          padding: 10px;
        }

        .file-panorama,
        .file-panorama-view {
          min-height: 320px;
          height: 320px;
        }
      }
    </style>
  </head>

          { id: "panel", name: "智能场景面板", location: "入户墙面", role: "把多个设备组合成一个按钮，老人和孩子也能直接使用。", x: 87, y: 48 },
          { id: "speaker", name: "智能音箱", location: "电视柜", role: "用语音控制灯光、窗帘、空调等常用设备。", x: 43, y: 60 },
          { id: "ac", name: "空调控制器", location: "空调附近", role: "让普通空调接入智能场景，自动调节温度。", x: 83, y: 23 },
          { id: "sensor", name: "门窗传感器", location: "窗边和入户门", role: "检测门窗开合状态，帮助判断家中是否安全。", x: 12, y: 22 },
        ];

        let activeCase = cases[0];
        let activeScene = scenes[0];
        let panoramaDrag = null;

        function render() {
          document.getElementById("root").innerHTML = `
            <header class="file-topbar">
              <button class="file-brand" data-view="home"><span><img src="./src/assets/zhizhuangxia-logo.png" alt="智装侠"></span><span>智能家居案例展示系统</span></button>
              <nav class="file-nav">
                <button data-view="cases">案例地图</button>
                <button data-view="showroom">案例演示</button>
              </nav>
            </header>
            <main id="file-view"></main>
            <div class="file-modal" id="file-modal">
              <article class="file-modal-card">
                <button class="file-ghost" data-close>关闭</button>
                <p class="file-eyebrow">产品介绍</p>
                <h2 id="modal-title"></h2>
                <p id="modal-body"></p>
                <p id="modal-location"></p>
              </article>
            </div>
          `;
          bindNav();
          showHome();
        }

        function bindNav() {
          document.querySelectorAll("[data-view]").forEach((button) => {
            button.addEventListener("click", () => {
              const view = button.dataset.view;
              if (view === "home") showHome();
              if (view === "cases") showCases();
              if (view === "showroom") showShowroom();
            });
          });
          document.querySelector("[data-close]").addEventListener("click", closeModal);
          document.getElementById("file-modal").addEventListener("click", (event) => {
            if (event.target.id === "file-modal") closeModal();
          });
        }

        function showHome() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-hero">
              <div class="file-hero-layout">
                <div class="file-hero-content">
                  <p class="file-eyebrow">智装侠智能生活案例</p>
                  <h1>智装侠智能家居案例展示</h1>
                  <p>从郑州真实落地案例，看回家、观影、睡前和离家时，灯光、窗帘、网络和音响怎样配合一家人的生活。</p>
                  <div class="file-hero-points">
                    <span>进门不摸黑</span>
                    <span>观影有氛围</span>
                    <span>离家少担心</span>
                  </div>
                  <div class="file-actions">
                    <button class="file-primary" data-home-cases>查看案例地图</button>
                    <button class="file-ghost" data-home-showroom>查看案例演示</button>
                  </div>
                </div>
              </div>
              <aside class="file-proof">
                <strong>郑州落地服务始于 2017</strong>
                <span>小米米家 / 苹果 HomeKit</span>
                <div class="file-proof-tags">
                  <b>绿米</b><b>易来</b><b>领普</b><b>皓逸</b>
                  <b>锐捷网络覆盖</b><b>KEF</b><b>蜗牛</b><b>Sonos</b>
                </div>
              </aside>
            </section>
          `;
          document.querySelector("[data-home-cases]").addEventListener("click", showCases);
          document.querySelector("[data-home-showroom]").addEventListener("click", showShowroom);
        }

        function showCases() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <p class="file-eyebrow">案例地图</p>
              <h1>已落地小区案例</h1>
              <p>先看做过哪些小区，再看每套房子怎么把灯光、窗帘、空调和安防变成日常好用的生活场景。</p>
              <div class="file-map-layout">
                <div class="file-map">
                  ${cases
                    .map(
                      (item) =>
                        `<button class="file-pin ${item.id === activeCase.id ? "active" : ""}" style="left:${item.x}%;top:${item.y}%" data-case="${item.id}">📍 ${item.name}</button>`,
                    )
                    .join("")}
                </div>
                <aside>
                  <div class="file-case-list">
                    ${cases
                      .map(
                        (item) =>
                          `<button class="file-case-button ${item.id === activeCase.id ? "active" : ""}" data-case="${item.id}"><strong>${item.name}</strong><br><small>${item.city}</small></button>`,
                      )
                      .join("")}
                  </div>
                  <article class="file-card" style="margin-top:14px">
                    <img src="${activeCase.cover}" alt="${activeCase.name}案例封面">
                    <div class="file-card-body">
                      <p class="file-eyebrow">${activeCase.city}</p>
                      <h2>${activeCase.name}</h2>
                      <p>${activeCase.intro}</p>
                      <p><strong>${activeCase.homeType}</strong></p>
                      <div class="file-tags">${activeCase.scenes.map((item) => `<span>${item}</span>`).join("")}</div>
                      <ul>${activeCase.highlights.map((item) => `<li>${item}</li>`).join("")}</ul>
                      <button class="file-primary" data-detail>查看详情</button>
                    </div>
                  </article>
                </aside>
              </div>
            </section>
          `;
          document.querySelectorAll("[data-case]").forEach((button) => {
            button.addEventListener("click", () => {
              activeCase = cases.find((item) => item.id === button.dataset.case) || cases[0];
              showCases();
            });
          });
          document.querySelector("[data-detail]").addEventListener("click", showDetail);
        }

        function showDetail() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <button class="file-ghost" data-back>返回案例地图</button>
              <p class="file-eyebrow" style="margin-top:24px">${activeCase.city}</p>
              <h1>${activeCase.name}</h1>
              <p>${activeCase.intro}</p>
              <div class="file-panorama" style="--panorama-image:url('${activeCase.panorama}')">
                <div class="file-panorama-view" data-panorama-view role="img" aria-label="${activeCase.name}全景图浏览"></div>
                <div class="file-panorama-caption">
                  <strong>全景图浏览</strong>
                  <small>按住画面左右拖动，像站在客厅里一样查看空间。客户可以先感受整体氛围，再进入场景演示看设备联动。</small>
                </div>
              </div>
              <div class="file-card">
                <img src="${activeCase.cover}" alt="${activeCase.name}案例图片" style="height:360px">
                <div class="file-card-body">
                  <h2>案例详情</h2>
                  <p><strong>户型面积：</strong>${activeCase.homeType}</p>
                  <p><strong>智能设备：</strong>智能灯、智能窗帘、智能面板、空调控制器、门窗传感器</p>
                  <p><strong>客户收益：</strong>${activeCase.benefits.join("、")}。</p>
                  <div class="file-tags">${activeCase.highlights.map((item) => `<span>${item}</span>`).join("")}</div>
                  <button class="file-primary" data-go-showroom>查看案例演示</button>
                </div>
              </div>
            </section>
          `;
          document.querySelector("[data-back]").addEventListener("click", showCases);
          document.querySelector("[data-go-showroom]").addEventListener("click", showShowroom);
          bindPanoramaDrag();
        }

        function bindPanoramaDrag() {
          const view = document.querySelector("[data-panorama-view]");
          if (!view) return;

          let position = 50;

          view.addEventListener("pointerdown", (event) => {
            panoramaDrag = { startX: event.clientX, startPosition: position };
            view.setPointerCapture(event.pointerId);
          });

          view.addEventListener("pointermove", (event) => {
            if (!panoramaDrag) return;
            const movement = (event.clientX - panoramaDrag.startX) * 0.08;
            position = ((panoramaDrag.startPosition - movement) % 100 + 100) % 100;
            view.style.setProperty("--panorama-x", `${position}%`);
          });

          const endDrag = (event) => {
            panoramaDrag = null;
            if (view.hasPointerCapture(event.pointerId)) {
              view.releasePointerCapture(event.pointerId);
            }
          };

          view.addEventListener("pointerup", endDrag);
          view.addEventListener("pointercancel", endDrag);
        }

        function showShowroom() {
          document.getElementById("file-view").innerHTML = `
            <section class="file-page">
              <p class="file-eyebrow">智能家居案例演示</p>
              <h1>客厅生活场景</h1>
              <p>切换不同模式，看同一个客厅怎样从进门明亮、晚饭后放松，过渡到睡前温暖和离家看护。</p>
              <div class="file-showroom">
                <div class="file-room" style="--room-light:${activeScene.color};--lamp-power:${activeScene.power};--curtain:${activeScene.curtainValue}">
                  <div class="file-room-caption">
                    <strong>${activeScene.name}</strong>
                    <small>${activeScene.detail}</small>
                  </div>
                  <div class="file-window"></div>
                  <div class="file-curtain"></div>
                  <div class="file-tv"></div>
                  <div class="file-sofa"></div>
                  <div class="file-table"></div>
                  <div class="file-light"></div>
                  <div class="file-ac"></div>
                  <div class="file-panel-device"></div>
                  ${products
                    .map(
                      (item) =>
                        `<button class="file-hotspot" style="left:${item.x}%;top:${item.y}%" title="${item.name}" data-product="${item.id}">i</button>`,
                    )
                    .join("")}
                </div>
                <aside class="file-panel">
                  <h2>当前场景：${activeScene.name}</h2>
                  <p class="file-scene-note">${activeScene.detail}</p>
                  <div class="file-scene-list">
                    ${scenes
                      .map(
                        (item) =>
                          `<button class="${item.id === activeScene.id ? "active" : ""}" data-scene="${item.id}">${item.name}</button>`,
                      )
                      .join("")}
                  </div>
                  <div class="file-status">
                    <div><span>灯光</span><strong>${activeScene.light}</strong></div>
                    <div><span>窗帘</span><strong>${activeScene.curtain}</strong></div>
                    <div><span>空调</span><strong>${activeScene.ac}</strong></div>
                    <div><span>安防</span><strong>${activeScene.security}</strong></div>
                  </div>
                  <h2>产品点位</h2>
                  <div class="file-product-list">
                    ${products.map((item) => `<button data-product="${item.id}"><strong>${item.name}</strong><br><small>${item.location}</small></button>`).join("")}
                  </div>
                </aside>
              </div>
            </section>
          `;
          document.querySelectorAll("[data-scene]").forEach((button) => {
            button.addEventListener("click", () => {
              activeScene = scenes.find((item) => item.id === button.dataset.scene) || scenes[0];
              showShowroom();
            });
          });
          document.querySelectorAll("[data-product]").forEach((button) => {
            button.addEventListener("click", () => {
              const product = products.find((item) => item.id === button.dataset.product);
              if (product) openModal(product);
            });
          });
        }

        function openModal(product) {
          document.getElementById("modal-title").textContent = product.name;
          document.getElementById("modal-body").textContent = `产品功能：${product.role}`;
          document.getElementById("modal-location").textContent = `适合位置：${product.location}。当前 ${activeScene.name} 中会配合其它设备一起工作。`;
          document.getElementById("file-modal").classList.add("open");
        }

        function closeModal() {
          document.getElementById("file-modal").classList.remove("open");
        }

        render();
      }

      if (location.protocol !== "file:" && !location.search.includes("static")) {
        import("/src/main.jsx").catch(runFileDemo);
      } else {
        runFileDemo();
      }
    </script>
  </body>
</html>
